name: Build AI Reader APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find project files
        run: |
          echo "Repository:"
          pwd
          echo "Files:"
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        run: |
          if [ -f "./settings.gradle.kts" ] || [ -f "./settings.gradle" ]; then
            gradle :app:assembleDebug --stacktrace
          elif [ -f "./AI-reader/settings.gradle.kts" ] || [ -f "./AI-reader/settings.gradle" ]; then
            cd AI-reader
            gradle :app:assembleDebug --stacktrace
          else
            echo "ERROR: Gradle project files were not found."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Reader-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            AI-reader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error